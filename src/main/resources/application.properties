server.port=8080
spring.application.name=Intelligent Test Data Generator
logging.level.org.springframework.web=ERROR

# ── Redis Trial Enforcement (feature/redis-trial-enforcement) ──────────────────
# Override redis.uri via env var REDIS_URI in production (never commit real URIs)
redis.uri=redis://localhost:6379

# Number of free parses per user; override with env TRIAL_FREE_COUNT
trial.free.count=5

# How many days before the trial window resets
trial.free.ttl.days=30

# Set to true in local dev to bypass trial enforcement entirely
# Override with env DEV_TRIAL_DISABLED=true
dev.trial.disabled=false

# Spec cache TTL in days
speccache.ttl.days=7

# Max accepted spec size in bytes (default 3 MB)
openapi.max.spec.size=3145728